<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Frog Skin Gradient -->
    <linearGradient id="frogSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Cheek Blush -->
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>

    <!-- Star Glow -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Lotus Pad Base -->
  <ellipse cx="256" cy="380" rx="190" ry="70" fill="#065f46" opacity="0.4" />
  <path d="M 80 370 Q 256 460 432 370 Q 450 350 420 330 Q 256 410 92 330 Z" fill="#059669" />

  <!-- Cute Frog Character -->
  <g filter="url(#dropShadow)">
    <!-- Eye Bumps -->
    <circle cx="170" cy="180" r="64" fill="url(#frogSkin)" />
    <circle cx="342" cy="180" r="64" fill="url(#frogSkin)" />

    <!-- Frog Head Body -->
    <ellipse cx="256" cy="270" rx="160" ry="120" fill="url(#frogSkin)" />

    <!-- Frog Belly -->
    <ellipse cx="256" cy="310" rx="100" ry="70" fill="#dcfce7" />

    <!-- Big Eyes White -->
    <circle cx="170" cy="175" r="46" fill="#ffffff" />
    <circle cx="342" cy="175" r="46" fill="#ffffff" />

    <!-- Pupils -->
    <circle cx="178" cy="172" r="28" fill="#1e293b" />
    <circle cx="334" cy="172" r="28" fill="#1e293b" />

    <!-- Eye Highlights -->
    <circle cx="168" cy="162" r="11" fill="#ffffff" />
    <circle cx="188" cy="180" r="5" fill="#ffffff" />
    <circle cx="324" cy="162" r="11" fill="#ffffff" />
    <circle cx="344" cy="180" r="5" fill="#ffffff" />

    <!-- Rosy Cheeks -->
    <circle cx="140" cy="275" r="24" fill="url(#blush)" />
    <circle cx="372" cy="275" r="24" fill="url(#blush)" />

    <!-- Happy Smiling Mouth -->
    <path d="M 195 270 Q 256 340 317 270" fill="none" stroke="#047857" stroke-width="12" stroke-linecap="round" />
    <path d="M 220 288 Q 256 325 292 288" fill="#f43f5e" />
  </g>

  <!-- Graduation Cap / Knowledge Sparkle on Head -->
  <g transform="translate(256, 95) scale(0.95)" filter="url(#dropShadow)">
    <!-- Little Golden Crown / Star of Knowledge -->
    <path d="M -40 20 L -25 -25 L 0 -5 L 25 -25 L 40 20 Z" fill="url(#starGrad)" stroke="#b45309" stroke-width="4" stroke-linejoin="round" />
    <circle cx="-25" cy="-25" r="6" fill="#ef4444" />
    <circle cx="0" cy="-5" r="6" fill="#3b82f6" />
    <circle cx="25" cy="-25" r="6" fill="#10b981" />
  </g>

  <!-- Sparkles -->
  <path d="M 410 110 Q 420 125 435 135 Q 420 145 410 160 Q 400 145 385 135 Q 400 125 410 110 Z" fill="#fef08a" />
  <circle cx="100" cy="130" r="8" fill="#ffffff" opacity="0.8" />
</svg>
